<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Koulen;src:url(Koulen-Regular.ttf)}
@font-face{font-family:Lilita;src:url(LilitaOne-Regular.ttf)}
@font-face{font-family:Nunito;src:url(Nunito-ExtraBold.ttf);font-weight:800}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#120d2a}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
 background:
  radial-gradient(ellipse 700px 420px at 960px 640px, rgba(255,214,140,.30), rgba(255,214,140,0) 70%),
  radial-gradient(ellipse 900px 700px at 120px 160px, rgba(131,110,249,.35), rgba(131,110,249,0) 70%),
  radial-gradient(ellipse 900px 600px at 1820px 1040px, rgba(216,62,126,.28), rgba(216,62,126,0) 70%),
  linear-gradient(180deg,#2a1f5c 0%,#1a1340 55%,#120d2a 100%)}
.logo{position:absolute;left:0;right:0;top:140px;text-align:center;font-family:Koulen;font-size:200px;line-height:1;letter-spacing:6px;
 color:#fdf7d3;-webkit-text-stroke:8px #140f24;paint-order:stroke fill;text-shadow:0 14px 0 #140f24}
.tag{position:absolute;left:0;right:0;top:350px;text-align:center;font-family:Lilita;font-size:54px;color:#ffe27a;
 -webkit-text-stroke:3px #140f24;paint-order:stroke fill;text-shadow:0 6px 0 #140f24;letter-spacing:1px}
.row{position:absolute;left:0;right:0;top:470px;height:420px}
.hero{position:absolute;width:380px;height:355px}
.hero img{position:absolute;left:0;top:0;width:380px;height:355px}
.pod{position:absolute;left:60px;width:260px;height:62px;top:318px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 35%,#ffe6a8 0%,#f5a20b 50%,#9a5b07 100%);border:5px solid #140f24;box-shadow:0 10px 0 #140f24}
.bottom{position:absolute;left:0;right:0;top:905px;text-align:center;font-family:Nunito;font-weight:800;font-size:30px;color:#e9e4ff;letter-spacing:3px}
.bottom b{color:#ffffff}
</style></head><body><div class="stage">
<div class="logo">CHOG ARENA</div>
<div class="tag">YOUR CHOG GENESIS IS YOUR HERO</div>
<div class="row">
 <div class="hero" style="left:40px;top:40px;transform:scale(.9)"><div class="pod"></div><img src="hero1.png"></div>
 <div class="hero" style="left:400px;top:10px;transform:scale(.98)"><div class="pod"></div><img src="hero2.png"></div>
 <div class="hero" style="left:770px;top:-20px;transform:scale(1.12)"><div class="pod"></div><img src="hero0.png"></div>
 <div class="hero" style="left:1140px;top:10px;transform:scale(.98)"><div class="pod"></div><img src="hero4.png"></div>
 <div class="hero" style="left:1500px;top:40px;transform:scale(.9)"><div class="pod"></div><img src="hero3.png"></div>
</div>
<div class="bottom"><b>3v3 ARENA</b> &nbsp;·&nbsp; 1,969 GENESIS, EACH A HERO &nbsp;·&nbsp; CAREERS ON <b>MONAD</b></div>
</div></body></html>
