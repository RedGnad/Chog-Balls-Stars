# Render blueprint: the whole game behind one address (docs/DEPLOY.md).
# One container (Dockerfile) serves the WebGL build, the hero page, the portraits and the
# services, and judges the matches with the .NET runtime it carries.
# Applied on 16 October 2026: the service is https://chog-genesis-game.onrender.com.
services:
  - type: web
    name: chog-genesis-game
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The free instance, chosen by the user on 12 October 2026 for the first tries, kept awake
    # by a ping from outside. It cannot have a disk: the careers and the records of the
    # matches are lost each time the container is replaced (a new deploy, a restart). Before
    # the submission: plan "starter" and the disk at the end of this file.
    plan: free
    healthCheckPath: /api/health
    # A push deploys again, and a new container loses the careers and the records of the
    # matches (a staked match in play then waits for its refund). So only a change to what the
    # image is made of deploys: the files the Dockerfile copies (see .dockerignore), and this
    # file. Docs, research and the 3D tools do not.
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - render.yaml
        - server/package.json
        - server/package-lock.json
        - server/src/**
        - web/hero/**
        - site/**
        - tests/fixtures/replays/**
        - tools/release/check_judge.sh
    envVars:
      # The public address of the game, without a trailing slash. Asked when the service is
      # created; it is written in the message a wallet signs.
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # What Photon's dashboard sends with its requests (docs/DEPLOY.md, "Photon"). Asked when
      # the service is created: paste the secret the dashboard already holds (WebHookSecret,
      # and the "key" of the authentication), so only the two addresses change there.
      - key: PHOTON_SECRET
        sync: false
      # Set to 1 once Photon's dashboard asks this service who a player is. Before that the
      # game must connect as it always did, or nobody could enter a match.
      - key: PHOTON_AUTH
        sync: false
      # The Reown project id (docs/DEPLOY.md, "The wallet connector"): lets a phone's normal
      # browser connect a wallet app. Leave empty to offer only the wallet of the browser.
      - key: REOWN_PROJECT_ID
        sync: false
      # The deployed shop contract (contracts/README.md). Leave empty while there is none: the
      # game then sells nothing.
      - key: SHOP_ADDRESS
        # Deployed on Monad mainnet on 16 October 2026 (contracts/script/DeployMainnet.s.sol).
        value: "0xb23a3c3492b9ba83d80c8abc9a5484d2885f058a"
      # The deployed rental contract (contracts/README.md). Leave empty while there is none: the
      # game then offers no rental.
      - key: RENTAL_ADDRESS
        value: "0x7f1271d43b0e41e2eeddd5290f459fdc6196a19a"
      # The deployed wager contract and the key of its referee (contracts/README.md): both or
      # neither. Leave empty while there is none: no match is then staked on.
      - key: WAGER_ADDRESS
        value: "0xc7524a808d2b00b43a4d3e2becb8500e409b41e3"
      # The key of the referee 0x125eE3EA9b3c0759C96dD3576A7CdB9D9Ba64E34 (.artifacts/services-public/
      # mainnet-referee-key on the development Mac): pasted when the service is created, never written here.
      - key: REFEREE_KEY
        sync: false
    # With plan "starter" (512 MB, half a CPU), add this disk so the careers survive:
    # disk:
    #   name: chog-data
    #   mountPath: /var/data
    #   sizeGB: 1
